
<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Máy quét mã PDF417 và ITF">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon.svg">
  <link rel="stylesheet" href="./assets/style.css">
  <title>Air Scanner</title>
</head>
<body>
  <main class="scanner" id="camera-stage">
    <video id="video" muted playsinline autoplay></video>

    <header class="top">
      <span class="camera-state" id="camera-state">ĐANG KHỞI TẠO</span>
      <div class="shield" aria-label="Air Scanner">
        <svg viewBox="0 0 64 72" fill="none" aria-hidden="true">
          <path d="M32 3 59 11V31C59 48 48 61 32 69 16 61 5 48 5 31V11L32 3Z"
            stroke="#bd00ff" stroke-width="5"/>
          <circle cx="32" cy="27" r="11" stroke="#bd00ff" stroke-width="2.5"/>
          <path d="M14 51C17 40 24 37 32 37S47 40 50 51"
            stroke="#bd00ff" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </div>
    </header>

    <div class="camera-placeholder" id="camera-placeholder">
      <span>ĐANG CHỜ CAMERA</span>
    </div>

    <div class="camera-overlay" aria-hidden="true">
      <div class="scan-frame">
        <i class="corner tl"></i>
        <i class="corner tr"></i>
        <i class="corner bl"></i>
        <i class="corner br"></i>
        <div class="scan-line"></div>
      </div>
    </div>

    <div class="camera-error" id="camera-error" hidden role="alert"></div>

    <div class="scan-diagnostics" id="scan-diagnostics" aria-live="polite">
      <strong id="scan-status">ĐANG KHỞI TẠO MÁY QUÉT</strong>
      <p id="scan-substatus">Đang chờ camera và bộ giải mã.</p>
    </div>

    <section class="result" id="result-content" hidden aria-live="polite">
      <span id="format-badge">BARCODE</span>
      <pre id="result-text"></pre>
      <div class="result-footer">
        <small id="result-time"></small>
        <button id="copy-button" type="button">Sao chép</button>
      </div>
    </section>

    <div class="bottom">
      <button class="torch-button" id="torch-button"
        type="button" aria-pressed="false" disabled>
        <span class="torch-icon">⚡</span>
      </button>
    </div>

    <!-- Giữ các phần tử này để tương thích với app.js hiện tại.
         Chúng không hiển thị trên giao diện. -->
    <div hidden>
      <button id="start-button" type="button">
        <span>Bắt đầu quét</span>
      </button>
      <button id="stop-button" type="button">Dừng</button>
      <span id="status-dot"></span>
      <div id="result-empty"></div>
    </div>
  </main>

  <script type="module" src="./assets/app.js"></script>
</body>
</html>
